name: iOS Build & Test

on:
  push:
    branches: [main, "ios-*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode & Simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -n 30

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios/Fast
        run: xcodegen generate

      - name: Boot Simulator & Run Tests
        working-directory: ios/Fast
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Using simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcodebuild test \
            -project Fast.xcodeproj \
            -scheme Fast \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
